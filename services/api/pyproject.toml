[project]
name = "kiln-api"
version = "0.0.0"
description = "Kiln HTTP API: assets, review and catalog."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
