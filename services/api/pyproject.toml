[project]
name = "kiln-api"
version = "0.0.0"
description = "Kiln HTTP API: assets, review and catalog."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.40",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
