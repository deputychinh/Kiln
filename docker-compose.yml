services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
      POSTGRES_DB: kiln
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiln']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db:/var/lib/postgresql/data

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kiln
      MINIO_ROOT_PASSWORD: kiln-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - storage:/data

volumes:
  db:
  storage:
