services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
      POSTGRES_DB: kiln
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiln']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db:/var/lib/postgresql/data

  storage:
    # S3-compatible object storage for local work (MinIO images are no longer published; ADR 0003).
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
    ports:
      - '8333:8333'
    volumes:
      - storage:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db:
  storage:
