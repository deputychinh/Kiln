name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiln" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KILN_TEST_DATABASE_URL: postgresql+psycopg://kiln:kiln@127.0.0.1:5432/kiln_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Start S3 storage (SeaweedFS, ADR 0003)
        run: docker compose up -d --wait storage
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - name: Storybook stories pass axe in both themes (KILN-7)
        run: npx playwright install --with-deps chromium && npm run e2e --workspace packages/ui
      - run: npx prettier --check .
      - name: commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          else
            npx commitlint --last
          fi
      - run: npm audit --audit-level=high --omit=dev
